<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-label="Flow diagram: AppSource Marketplace leads to Search and Preview, into Import, into Visualizations Pane, into drag onto canvas.">
  <rect width="900" height="220" fill="#FFFFFF"/>
  <defs>
    <marker id="cvArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565B6B"/>
    </marker>
  </defs>
  <g font-family="Georgia, serif">
    <!-- box 1 -->
    <rect x="20" y="70" width="150" height="80" rx="10" fill="none" stroke="#C97A1E" stroke-width="1.6"/>
    <text x="95" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#14171F">AppSource</text>
    <text x="95" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#14171F">Marketplace</text>
    <text x="95" y="163" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">the source</text>

    <!-- box 2 -->
    <rect x="210" y="70" width="150" height="80" rx="10" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
    <text x="285" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#14171F">Search &amp;</text>
    <text x="285" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#14171F">Preview</text>
    <text x="285" y="163" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">check reviews</text>

    <!-- box 3 -->
    <rect x="400" y="70" width="150" height="80" rx="10" fill="#2A6560"/>
    <text x="475" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Import</text>
    <text x="475" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">to Report</text>
    <text x="475" y="163" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">one-time step</text>

    <!-- box 4 -->
    <rect x="590" y="70" width="150" height="80" rx="10" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
    <text x="665" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#14171F">Visualizations</text>
    <text x="665" y="123" text-anchor="middle" font-size="14" font-weight="700" fill="#14171F">Pane</text>
    <text x="665" y="163" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">now lives here</text>

    <!-- box 5 -->
    <rect x="750" y="70" width="130" height="80" rx="10" fill="none" stroke="#C97A1E" stroke-width="1.6"/>
    <text x="815" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#14171F">Drag onto</text>
    <text x="815" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#14171F">Canvas</text>
    <text x="815" y="163" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">works like any chart</text>

    <line x1="171" y1="110" x2="208" y2="110" stroke="#565B6B" stroke-width="1.4" marker-end="url(#cvArrow)"/>
    <line x1="361" y1="110" x2="398" y2="110" stroke="#565B6B" stroke-width="1.4" marker-end="url(#cvArrow)"/>
    <line x1="551" y1="110" x2="588" y2="110" stroke="#565B6B" stroke-width="1.4" marker-end="url(#cvArrow)"/>
    <line x1="741" y1="110" x2="748" y2="110" stroke="#565B6B" stroke-width="1.4" marker-end="url(#cvArrow)"/>
  </g>
</svg>
