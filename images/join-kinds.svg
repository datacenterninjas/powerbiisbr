    <text x="150.0" y="34" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14171F">LEFT OUTER</text>
    <circle cx="122" cy="98" r="50" fill="#2A6560" fill-opacity="0.45"/>
    <circle cx="122" cy="98" r="50" fill="none" stroke="#2A6560" stroke-width="1.5"/>
    <circle cx="178" cy="98" r="50" fill="none" stroke="#2A6560" stroke-width="1.5"/>
    <text x="64" y="102" text-anchor="end" font-size="10" fill="#565B6B">Orders</text>
    <text x="236" y="102" font-size="10" fill="#565B6B">Returns</text>
    <text x="150.0" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#C97A1E">35 rows</text>
    <text x="150.0" y="194" text-anchor="middle" font-size="10.5" fill="#565B6B">every order + return info if any</text>
    <rect x="295" y="10" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#DEDACE"/>
    <text x="435.0" y="34" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14171F">RIGHT OUTER</text>
    <circle cx="463" cy="98" r="50" fill="#2A6560" fill-opacity="0.45"/>
    <circle cx="407" cy="98" r="50" fill="none" stroke="#2A6560" stroke-width="1.5"/>
    <circle cx="463" cy="98" r="50" fill="none" stroke="#2A6560" stroke-width="1.5"/>
