<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="The six join kinds in Power Query's Merge dialog, shown as overlapping circles for Orders (left, PQ_Practice_Orders.csv, 35 rows) and Returns (right, PQ_Practice_Returns.csv, 10 rows) matched on Order ID. Shaded area is what the result keeps. Left Outer keeps 35 rows: every order plus return info where it exists. Right Outer keeps 10: every return plus order info where it exists. Full Outer keeps 37: everything from both sides. Inner keeps 8: only orders that were returned. Left Anti keeps 27: orders never returned. Right Anti keeps 2: returns with no matching order, ORD2036 and ORD2044, which belong to the other month's file.">
  <rect width="860" height="440" fill="#FFFFFF"/>
  <defs>
    <clipPath id="jkL0"><circle cx="122" cy="98" r="50"/></clipPath>
    <clipPath id="jkL1"><circle cx="407" cy="98" r="50"/></clipPath>
    <clipPath id="jkL2"><circle cx="692" cy="98" r="50"/></clipPath>
    <clipPath id="jkL3"><circle cx="122" cy="308" r="50"/></clipPath>
    <clipPath id="jkL4"><circle cx="407" cy="308" r="50"/></clipPath>
    <clipPath id="jkL5"><circle cx="692" cy="308" r="50"/></clipPath>
  </defs>
  <g font-family="ui-monospace,Consolas,monospace">
