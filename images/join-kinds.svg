    <text x="521" y="312" font-size="10" fill="#565B6B">Returns</text>
    <text x="435.0" y="384" text-anchor="middle" font-size="13" font-weight="700" fill="#C97A1E">27 rows</text>
    <text x="435.0" y="404" text-anchor="middle" font-size="10.5" fill="#565B6B">orders never returned</text>
    <rect x="580" y="220" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#DEDACE"/>
    <text x="720.0" y="244" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14171F">RIGHT ANTI</text>
    <circle cx="748" cy="308" r="50" fill="#2A6560" fill-opacity="0.45"/>
    <circle cx="692" cy="308" r="50" fill="#FFFFFF"/>
    <circle cx="692" cy="308" r="50" fill="none" stroke="#2A6560" stroke-width="1.5"/>
