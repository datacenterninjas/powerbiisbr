    <text x="435.0" y="194" text-anchor="middle" font-size="10.5" fill="#565B6B">every return + order info if any</text>
    <rect x="580" y="10" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#DEDACE"/>
    <text x="720.0" y="34" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14171F">FULL OUTER</text>
    <circle cx="692" cy="98" r="50" fill="#2A6560" fill-opacity="0.45"/>
    <circle cx="748" cy="98" r="50" fill="#2A6560" fill-opacity="0.45"/>
