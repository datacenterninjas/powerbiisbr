    <text x="720.0" y="194" text-anchor="middle" font-size="10.5" fill="#565B6B">everything from both sides</text>
    <rect x="10" y="220" width="280" height="200" rx="8" fill="#FFFFFF" stroke="#DEDACE"/>
    <text x="150.0" y="244" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14171F">INNER</text>
    <circle cx="178" cy="308" r="50" fill="#2A6560" fill-opacity="0.45" clip-path="url(#jkL3)"/>
