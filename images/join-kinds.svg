    <text x="720.0" y="404" text-anchor="middle" font-size="10.5" fill="#565B6B">returns with no matching order</text>
    <text x="430" y="432" text-anchor="middle" font-size="10.5" fill="#565B6B">Orders = PQ_Practice_Orders.csv (35 rows) · Returns = PQ_Practice_Returns.csv (10 rows) · matched on Order ID · shaded = kept</text>
  </g>
</svg>
