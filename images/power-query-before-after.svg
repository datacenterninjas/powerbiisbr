<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-label="Before: a small Banking table with a currency-formatted Loan Amount, trailing spaces on a Customer name, inconsistent Loan Status casing, and a duplicate row, each highlighted. After: the same rows cleaned in Power Query — plain numbers, trimmed text, consistent status values, and the duplicate row removed.">
  <rect width="820" height="300" fill="#FFFFFF"/>
  <defs>
    <marker id="pqArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565B6B"/>
    </marker>
  </defs>
  <g font-family="ui-monospace,Consolas,monospace" font-size="10">
    <text x="180" y="24" text-anchor="middle" letter-spacing="1" fill="#565B6B">BEFORE — Banking_Dirty.csv</text>
    <text x="640" y="24" text-anchor="middle" letter-spacing="1" fill="#565B6B">AFTER — cleaned in Power Query</text>

    <!-- BEFORE table -->
    <g transform="translate(20,40)">
      <rect width="320" height="210" fill="none" stroke="#DEDACE"/>
      <line x1="0" y1="30" x2="320" y2="30" stroke="#DEDACE"/>
      <line x1="150" y1="0" x2="150" y2="210" stroke="#DEDACE"/>
      <line x1="250" y1="0" x2="250" y2="210" stroke="#DEDACE"/>
      <text x="10" y="20" fill="#14171F" font-weight="700">Customer</text>
      <text x="160" y="20" fill="#14171F" font-weight="700">Loan Amount</text>
      <text x="256" y="20" fill="#14171F" font-weight="700">Status</text>

      <text x="10" y="50" fill="#14171F">Suresh Gupta</text>
      <rect x="150" y="35" width="100" height="20" fill="#F6E4DF"/>
      <text x="160" y="50" fill="#B3402D">"₹10,00,000"</text>
      <text x="256" y="50" fill="#14171F">Rejected</text>

      <text x="10" y="80" fill="#14171F">Nisha Nair</text>
      <text x="160" y="80" fill="#14171F">100000</text>
      <text x="256" y="80" fill="#14171F">Rejected</text>

      <rect x="0" y="95" width="150" height="20" fill="#F6E4DF"/>
      <text x="10" y="110" fill="#B3402D">"Swati Chatterjee   "</text>
      <text x="160" y="110" fill="#14171F">2000000</text>
      <text x="256" y="110" fill="#14171F">Approved</text>

      <text x="10" y="140" fill="#14171F">Ajay Rao</text>
      <text x="160" y="140" fill="#14171F">3000000</text>
      <rect x="250" y="125" width="70" height="20" fill="#F6E4DF"/>
      <text x="256" y="140" fill="#B3402D">rejected</text>

      <rect x="0" y="155" width="320" height="20" fill="#F6E4DF"/>
      <text x="10" y="170" fill="#B3402D">Suresh Gupta</text>
      <text x="160" y="170" fill="#B3402D">"₹10,00,000"</text>
      <text x="256" y="170" fill="#B3402D">Rejected</text>
      <text x="10" y="195" fill="#B3402D" font-weight="700">↑ exact duplicate of row 1</text>
    </g>

    <path d="M360,145 C390,145 400,145 430,145" stroke="#C97A1E" stroke-width="2" fill="none" marker-end="url(#pqArrow)"/>
    <text x="395" y="130" text-anchor="middle" fill="#C97A1E" font-size="9">Power Query</text>

    <!-- AFTER table -->
    <g transform="translate(480,40)">
      <rect width="320" height="180" fill="none" stroke="#DEDACE"/>
      <line x1="0" y1="30" x2="320" y2="30" stroke="#DEDACE"/>
      <line x1="150" y1="0" x2="150" y2="180" stroke="#DEDACE"/>
      <line x1="250" y1="0" x2="250" y2="180" stroke="#DEDACE"/>
      <text x="10" y="20" fill="#14171F" font-weight="700">Customer</text>
      <text x="160" y="20" fill="#14171F" font-weight="700">Loan Amount</text>
      <text x="256" y="20" fill="#14171F" font-weight="700">Status</text>

      <text x="10" y="50" fill="#14171F">Suresh Gupta</text>
      <text x="160" y="50" fill="#2E7D4F">1000000</text>
      <text x="256" y="50" fill="#14171F">Rejected</text>

      <text x="10" y="80" fill="#14171F">Nisha Nair</text>
      <text x="160" y="80" fill="#14171F">100000</text>
      <text x="256" y="80" fill="#14171F">Rejected</text>

      <text x="10" y="110" fill="#2E7D4F">Swati Chatterjee</text>
      <text x="160" y="110" fill="#14171F">2000000</text>
      <text x="256" y="110" fill="#14171F">Approved</text>

      <text x="10" y="140" fill="#14171F">Ajay Rao</text>
      <text x="160" y="140" fill="#14171F">3000000</text>
      <text x="256" y="140" fill="#2E7D4F">Rejected</text>

      <text x="10" y="165" fill="#565B6B" font-style="italic">(duplicate row removed)</text>
    </g>
  </g>
</svg>
