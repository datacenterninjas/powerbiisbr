<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" role="img" aria-label="Four distribution shapes: normal/bell curve, right-skewed, left-skewed, and bimodal, each with bars beneath the curve.">
  <rect width="820" height="210" fill="#FFFFFF"/>
  <g font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#565B6B">

    <!-- Normal -->
    <g transform="translate(20,20)">
      <g fill="#2A6560" opacity=".55">
        <rect x="0" y="100" width="14" height="10"/><rect x="16" y="80" width="14" height="30"/><rect x="32" y="55" width="14" height="55"/>
        <rect x="48" y="30" width="14" height="80"/><rect x="64" y="20" width="14" height="90"/><rect x="80" y="30" width="14" height="80"/>
        <rect x="96" y="55" width="14" height="55"/><rect x="112" y="80" width="14" height="30"/><rect x="128" y="100" width="14" height="10"/>
      </g>
      <line x1="-4" y1="110" x2="146" y2="110" stroke="#DEDACE"/>
      <text x="71" y="135" text-anchor="middle" font-weight="700" fill="#14171F">Normal / Bell</text>
      <text x="71" y="150" text-anchor="middle">most values near the middle</text>
    </g>

    <!-- Right-skewed -->
    <g transform="translate(225,20)">
      <g fill="#2A6560" opacity=".55">
        <rect x="0" y="30" width="14" height="80"/><rect x="16" y="45" width="14" height="65"/><rect x="32" y="60" width="14" height="50"/>
        <rect x="48" y="75" width="14" height="35"/><rect x="64" y="88" width="14" height="22"/><rect x="80" y="96" width="14" height="14"/>
        <rect x="96" y="102" width="14" height="8"/><rect x="112" y="106" width="14" height="4"/><rect x="128" y="108" width="14" height="2"/>
      </g>
      <line x1="-4" y1="110" x2="146" y2="110" stroke="#DEDACE"/>
      <text x="71" y="135" text-anchor="middle" font-weight="700" fill="#14171F">Right-skewed</text>
      <text x="71" y="150" text-anchor="middle">a long tail of high values</text>
    </g>

    <!-- Left-skewed -->
    <g transform="translate(430,20)">
      <g fill="#2A6560" opacity=".55">
        <rect x="0" y="108" width="14" height="2"/><rect x="16" y="106" width="14" height="4"/><rect x="32" y="102" width="14" height="8"/>
        <rect x="48" y="96" width="14" height="14"/><rect x="64" y="88" width="14" height="22"/><rect x="80" y="75" width="14" height="35"/>
        <rect x="96" y="60" width="14" height="50"/><rect x="112" y="45" width="14" height="65"/><rect x="128" y="30" width="14" height="80"/>
      </g>
      <line x1="-4" y1="110" x2="146" y2="110" stroke="#DEDACE"/>
      <text x="71" y="135" text-anchor="middle" font-weight="700" fill="#14171F">Left-skewed</text>
      <text x="71" y="150" text-anchor="middle">a long tail of low values</text>
    </g>

    <!-- Bimodal -->
    <g transform="translate(635,20)">
      <g fill="#2A6560" opacity=".55">
        <rect x="0" y="80" width="14" height="30"/><rect x="16" y="40" width="14" height="70"/><rect x="32" y="70" width="14" height="40"/>
        <rect x="48" y="95" width="14" height="15"/><rect x="64" y="100" width="14" height="10"/><rect x="80" y="90" width="14" height="20"/>
        <rect x="96" y="60" width="14" height="50"/><rect x="112" y="35" width="14" height="75"/><rect x="128" y="75" width="14" height="35"/>
      </g>
      <line x1="-4" y1="110" x2="146" y2="110" stroke="#DEDACE"/>
      <text x="71" y="135" text-anchor="middle" font-weight="700" fill="#14171F">Bimodal</text>
      <text x="71" y="150" text-anchor="middle">two separate peaks — two groups?</text>
    </g>
  </g>
</svg>
