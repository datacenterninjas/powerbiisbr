<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" role="img" aria-label="Nested rectangles diagram: Report is the outermost scope, containing Page, containing Visual, the narrowest scope.">
  <rect width="620" height="320" fill="#FFFFFF"/>
  <g font-family="Georgia,serif">
    <rect x="30" y="30" width="560" height="260" rx="14" fill="#F6F0E4" stroke="#C97A1E" stroke-width="1.6"/>
    <text x="55" y="60" font-size="15" font-weight="700" fill="#1B1300">Report</text>
    <text x="55" y="78" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#8a6a2f">every page, every visual</text>

    <rect x="80" y="95" width="460" height="175" rx="12" fill="#EAF3F1" stroke="#2A6560" stroke-width="1.6"/>
    <text x="105" y="122" font-size="15" font-weight="700" fill="#14382f">Page</text>
    <text x="105" y="140" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#3f6f66">every visual on this page</text>

    <rect x="140" y="155" width="340" height="90" rx="10" fill="#FFFFFF" stroke="#565B6B" stroke-width="1.6"/>
    <text x="165" y="185" font-size="15" font-weight="700" fill="#14171F">Visual</text>
    <text x="165" y="203" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">just this one chart</text>
    <g transform="translate(240,175)">
      <rect x="0" y="30" width="14" height="20" fill="#2A6560" opacity=".6"/>
      <rect x="18" y="15" width="14" height="35" fill="#2A6560" opacity=".6"/>
      <rect x="36" y="25" width="14" height="25" fill="#2A6560" opacity=".6"/>
      <rect x="54" y="5" width="14" height="45" fill="#C97A1E"/>
    </g>
  </g>
  <text x="310" y="305" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="11" fill="#565B6B">a filter set at any level is inherited by everything inside it</text>
</svg>
