<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Where Power Query sits in Power BI. Left: data sources (CSV and Excel files, SQL Server such as AdventureWorksDW, web and SharePoint). They flow into Power Query, where a query is a recipe of Applied Steps written in M: Source, Promoted Headers, Changed Type, Trimmed Text, Removed Duplicates. Close and Apply loads the result into the Data Model, where tables are joined by relationships. DAX measures are calculated on the model, and report visuals display them. A dashed arrow from Refresh loops back to the sources: every refresh re-reads the source and replays every Applied Step in order; the original files are never modified.">
  <rect width="860" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="pqArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565B6B"/>
    </marker>
  </defs>
  <g font-family="ui-monospace,Consolas,monospace">
    <!-- Sources -->
    <text x="90" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#565B6B">1 · SOURCES</text>
    <rect x="20" y="44" width="140" height="30" rx="6" fill="#F2F1EB" stroke="#DEDACE"/>
    <text x="90" y="63" text-anchor="middle" font-size="11" fill="#14171F">CSV / Excel</text>
    <rect x="20" y="82" width="140" height="30" rx="6" fill="#F2F1EB" stroke="#DEDACE"/>
    <text x="90" y="101" text-anchor="middle" font-size="11" fill="#14171F">SQL Server (DW)</text>
    <rect x="20" y="120" width="140" height="30" rx="6" fill="#F2F1EB" stroke="#DEDACE"/>
    <text x="90" y="139" text-anchor="middle" font-size="11" fill="#14171F">Web / SharePoint</text>
    <text x="90" y="172" text-anchor="middle" font-size="10" fill="#565B6B">never modified</text>

    <line x1="162" y1="97" x2="204" y2="97" stroke="#565B6B" stroke-width="1.5" marker-end="url(#pqArrow)"/>

    <!-- Power Query -->
    <rect x="206" y="20" width="250" height="196" rx="8" fill="#DCEBE8" stroke="#2A6560" stroke-width="1.5"/>
    <text x="331" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#2A6560">2 · POWER QUERY</text>
    <text x="331" y="58" text-anchor="middle" font-size="10" fill="#2A6560">a query = a recipe of steps (M)</text>
    <g font-size="10.5" fill="#14171F">
      <rect x="226" y="68" width="210" height="22" rx="4" fill="#FFFFFF" stroke="#DEDACE"/>
      <text x="236" y="83">1  Source</text>
      <rect x="226" y="94" width="210" height="22" rx="4" fill="#FFFFFF" stroke="#DEDACE"/>
      <text x="236" y="109">2  Promoted Headers</text>
      <rect x="226" y="120" width="210" height="22" rx="4" fill="#FFFFFF" stroke="#DEDACE"/>
      <text x="236" y="135">3  Changed Type</text>
      <rect x="226" y="146" width="210" height="22" rx="4" fill="#FFFFFF" stroke="#DEDACE"/>
      <text x="236" y="161">4  Trimmed Text</text>
      <rect x="226" y="172" width="210" height="22" rx="4" fill="#FFFFFF" stroke="#DEDACE"/>
      <text x="236" y="187">5  Removed Duplicates</text>
    </g>
    <text x="331" y="210" text-anchor="middle" font-size="10" fill="#2A6560">Applied Steps pane</text>

    <line x1="458" y1="118" x2="520" y2="118" stroke="#565B6B" stroke-width="1.5" marker-end="url(#pqArrow)"/>
    <text x="489" y="108" text-anchor="middle" font-size="9.5" fill="#565B6B">Close</text>
    <text x="489" y="138" text-anchor="middle" font-size="9.5" fill="#565B6B">&amp; Apply</text>

    <!-- Model -->
    <rect x="522" y="60" width="150" height="116" rx="8" fill="#F6E7CF" stroke="#C97A1E" stroke-width="1.5"/>
    <text x="597" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#C97A1E">3 · DATA MODEL</text>
    <rect x="536" y="94" width="54" height="26" rx="4" fill="#FFFFFF" stroke="#C97A1E"/>
    <text x="563" y="111" text-anchor="middle" font-size="10" fill="#14171F">Dim</text>
    <rect x="604" y="134" width="54" height="26" rx="4" fill="#FFFFFF" stroke="#C97A1E"/>
    <text x="631" y="151" text-anchor="middle" font-size="10" fill="#14171F">Fact</text>
    <line x1="580" y1="120" x2="614" y2="134" stroke="#C97A1E" stroke-width="1.5"/>
    <text x="566" y="170" text-anchor="middle" font-size="9" fill="#565B6B">relationship</text>

    <line x1="674" y1="118" x2="712" y2="118" stroke="#565B6B" stroke-width="1.5" marker-end="url(#pqArrow)"/>

    <!-- DAX + visuals -->
    <rect x="714" y="60" width="126" height="50" rx="8" fill="#F2F1EB" stroke="#DEDACE"/>
    <text x="777" y="81" text-anchor="middle" font-size="12" font-weight="700" fill="#14171F">4 · DAX</text>
    <text x="777" y="98" text-anchor="middle" font-size="10" fill="#565B6B">measures</text>
    <line x1="777" y1="110" x2="777" y2="124" stroke="#565B6B" stroke-width="1.5" marker-end="url(#pqArrow)"/>
    <rect x="714" y="126" width="126" height="50" rx="8" fill="#F2F1EB" stroke="#DEDACE"/>
    <text x="777" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#14171F">5 · VISUALS</text>
    <text x="777" y="164" text-anchor="middle" font-size="10" fill="#565B6B">the report</text>

    <!-- Refresh loop -->
    <path d="M 597 176 L 597 262 L 90 262 L 90 182" fill="none" stroke="#C97A1E" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#pqArrow)"/>
    <rect x="250" y="248" width="360" height="28" rx="6" fill="#FFFFFF" stroke="#C97A1E"/>
    <text x="430" y="266" text-anchor="middle" font-size="11" fill="#C97A1E" font-weight="700">REFRESH: re-read the source, replay every step</text>

    <text x="430" y="306" text-anchor="middle" font-size="10.5" fill="#565B6B">Clean once in Power Query → next month's file gets the exact same cleaning automatically.</text>
  </g>
</svg>
