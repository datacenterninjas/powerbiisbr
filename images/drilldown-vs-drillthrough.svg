<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Two rows comparing drill-down, which goes deeper on the same chart, against drill-through, which jumps to a separate detail page.">
  <rect width="820" height="260" fill="#FFFFFF"/>
  <defs>
    <marker id="ddArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#565B6B"/>
    </marker>
  </defs>
  <g font-family="Georgia,serif">
    <!-- Drill-down row -->
    <text x="20" y="30" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" fill="#C97A1E">DRILL-DOWN — same chart, deeper level</text>
    <rect x="20" y="45" width="160" height="80" rx="8" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
    <text x="100" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#14171F">Category</text>
    <text x="100" y="98" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">3 bars</text>
    <line x1="184" y1="85" x2="216" y2="85" stroke="#565B6B" stroke-width="1.4" marker-end="url(#ddArrow)"/>
    <rect x="220" y="45" width="160" height="80" rx="8" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
    <text x="300" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#14171F">Sub-Category</text>
    <text x="300" y="98" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">8 bars</text>
    <line x1="384" y1="85" x2="416" y2="85" stroke="#565B6B" stroke-width="1.4" marker-end="url(#ddArrow)"/>
    <rect x="420" y="45" width="160" height="80" rx="8" fill="#2A6560"/>
    <text x="500" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Product</text>
    <text x="500" y="98" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#EAF3F1">20+ bars</text>
    <text x="620" y="90" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">← still one visual, one page</text>

    <!-- Drill-through row -->
    <text x="20" y="175" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" fill="#C97A1E">DRILL-THROUGH — jumps to a different page</text>
    <rect x="20" y="190" width="180" height="60" rx="8" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
    <text x="110" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#14171F">Sales Overview</text>
    <text x="110" y="233" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">right-click a point</text>
    <line x1="204" y1="220" x2="256" y2="220" stroke="#565B6B" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ddArrow)"/>
    <text x="230" y="205" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#C97A1E">jump</text>
    <rect x="260" y="190" width="180" height="60" rx="8" fill="#C97A1E"/>
    <text x="350" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1300">Customer Detail</text>
    <text x="350" y="233" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#1B1300">a whole new page</text>
    <text x="500" y="225" font-size="11" font-family="ui-monospace,Consolas,monospace" fill="#565B6B">← different layout entirely, with a Back button</text>
  </g>
</svg>
