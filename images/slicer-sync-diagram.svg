<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-label="One Region slicer connects to three separate report pages, keeping all of them filtered to the same selection at once.">
  <rect width="700" height="300" fill="#FFFFFF"/>
  <defs>
    <marker id="syncArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C97A1E"/>
    </marker>
  </defs>
  <g font-family="Georgia,serif">
    <rect x="270" y="20" width="160" height="60" rx="10" fill="#C97A1E"/>
    <text x="350" y="46" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1300">Region Slicer</text>
    <text x="350" y="64" text-anchor="middle" font-size="10" font-family="ui-monospace,Consolas,monospace" fill="#1B1300">North ✓ selected</text>

    <line x1="330" y1="80" x2="120" y2="180" stroke="#C97A1E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#syncArrow)"/>
    <line x1="350" y1="80" x2="350" y2="180" stroke="#C97A1E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#syncArrow)"/>
    <line x1="370" y1="80" x2="580" y2="180" stroke="#C97A1E" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#syncArrow)"/>

    <g font-family="ui-monospace,Consolas,monospace">
      <rect x="40" y="190" width="160" height="90" rx="8" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
      <text x="120" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#14171F" font-family="Georgia,serif">Overview</text>
      <text x="120" y="232" text-anchor="middle" font-size="9" fill="#2A6560">Sync: ON</text>
      <rect x="60" y="245" width="20" height="25" fill="#2A6560" opacity=".6"/><rect x="90" y="235" width="20" height="35" fill="#2A6560" opacity=".6"/><rect x="120" y="250" width="20" height="20" fill="#2A6560" opacity=".6"/>

      <rect x="270" y="190" width="160" height="90" rx="8" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
      <text x="350" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#14171F" font-family="Georgia,serif">Regional Detail</text>
      <text x="350" y="232" text-anchor="middle" font-size="9" fill="#2A6560">Sync: ON</text>
      <rect x="290" y="245" width="20" height="25" fill="#2A6560" opacity=".6"/><rect x="320" y="235" width="20" height="35" fill="#2A6560" opacity=".6"/><rect x="350" y="250" width="20" height="20" fill="#2A6560" opacity=".6"/>

      <rect x="500" y="190" width="160" height="90" rx="8" fill="none" stroke="#DEDACE" stroke-width="1.3"/>
      <text x="580" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#14171F" font-family="Georgia,serif">Product Detail</text>
      <text x="580" y="232" text-anchor="middle" font-size="9" fill="#2A6560">Sync: ON</text>
      <rect x="520" y="245" width="20" height="25" fill="#2A6560" opacity=".6"/><rect x="550" y="235" width="20" height="35" fill="#2A6560" opacity=".6"/><rect x="580" y="250" width="20" height="20" fill="#2A6560" opacity=".6"/>
    </g>
  </g>
</svg>
