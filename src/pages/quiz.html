      <footer class="pagefoot"><span>★ Self-Test Quiz</span><a href="35-troubleshooting.html">Next: Troubleshooting →</a></footer>

<script>
/* ============= quiz data (15 MCQ + 6 scenario) ============= */
const QUIZ = [
{t:'mcq', mod:'Architecture', q:'What is the correct order of the Power BI data journey?', opts:['Visuals → Data Model → Power Query → DAX','Data Sources → Power Query → Data Model → DAX → Visuals → Service','DAX → Power Query → Visuals → Data Sources','Power Query → Visuals → Data Sources → DAX'], correct:1, explain:'You can\'t clean before you have a source, or visualize before cleaning — the six stages always run in this order.'},
{t:'mcq', mod:'Architecture', q:'Where do you go to remove duplicate rows or fix spelling mistakes in your data?', opts:['Report View','Power Query Editor (Transform Data)','Visualizations Pane','Power BI Service'], correct:1, explain:'Power Query Editor is the only place raw data gets cleaned — never on a chart directly.'},
{t:'mcq', mod:'Architecture', q:'What is the main difference between a "Report" and a "Dashboard"?', opts:['They are exactly the same thing','A Report is only in Excel; a Dashboard is only in Power BI','A Report is a multi-page file built in Desktop; a Dashboard is a single-page pinboard in the Service','A Dashboard can only contain one chart'], correct:2, explain:'Report = multi-page file in Desktop. Dashboard = single-page cloud pinboard in the Service.'},
{t:'mcq', mod:'Architecture', q:'Which pane do you drag a column like "Region" or "Sales" from, to build a chart?', opts:['Filters Pane','Fields Pane','Insert Ribbon','Model View'], correct:1, explain:'The Fields Pane lists every available table/column — you drag from there onto a visual.'},
{t:'mcq', mod:'Architecture', q:'What does a Gateway do?', opts:['Deletes old data automatically','Securely connects Power BI Service in the cloud to data inside a private company network','Is another name for a dashboard','Creates DAX formulas automatically'], correct:1, explain:'A Gateway is the secure bridge letting cloud Power BI Service reach an on-premises/private data source.'},
{t:'scenario', mod:'Architecture', q:'You are a Blinkit analyst. Your manager emails you a messy Excel file with delivery times and asks for a dashboard by tomorrow morning. What are the first TWO things you should do in Power BI, in order?', explain:'(1) Get Data → Excel to load the file, then (2) Transform Data to open Power Query and clean it — cleaning always happens before charting, because building on dirty data produces wrong, misleading numbers.'},
{t:'scenario', mod:'Architecture', q:'Your hospital dashboard has two tables, "Patients" and "Doctors." A chart showing "patients per doctor" throws an error. What screen should you check first, and why?', explain:'Model View — to see whether a relationship exists between the two tables. Without a relationship, they can\'t "talk" to each other for a cross-table calculation.'},
{t:'mcq', mod:'Connecting & Power Query', q:'You\'ve just connected to an Excel file in the Navigator window. Which button should you click if the data looks messy?', opts:['Load','Transform Data','Combine','Cancel'], correct:1, explain:'Transform Data opens Power Query so you clean before the data enters your report.'},
{t:'mcq', mod:'Connecting & Power Query', q:'Which connection mode copies data into Power BI\'s own memory and needs a manual/scheduled Refresh to stay current?', opts:['DirectQuery','Live Connection','Import','Gateway'], correct:2, explain:'Import copies data into memory; DirectQuery and Live Connection stay live against the source instead.'},
{t:'mcq', mod:'Connecting & Power Query', q:'Which transformation fixes "  Rohit Singh  " so it matches "Rohit Singh" exactly?', opts:['Split Column','Trim','Fill Down','Merge Columns'], correct:1, explain:'Trim specifically strips leading/trailing spaces.'},
{t:'mcq', mod:'Connecting & Power Query', q:'A column shows "North" once, then 9 blank cells below it (from a merged-cell Excel export). What fixes this?', opts:['Remove Duplicates','Fill Down','Replace Values','Change Data Type'], correct:1, explain:'Fill Down copies the last non-blank value downward into the blanks below it.'},
{t:'mcq', mod:'Connecting & Power Query', q:'Which is the safest way to connect to a public Wikipedia table?', opts:['Get Data → SQL Server','Get Data → Web → paste URL','Get Data → Excel','Manually retype the table into Excel first'], correct:1, explain:'Get Data → Web reads HTML tables directly from a pasted URL.'},
{t:'scenario', mod:'Connecting & Power Query', q:'You import a banking dataset and the Loan Amount column shows values like "₹10,00,000" — Power BI won\'t let you sum it in a chart. What\'s happening, and how do you fix it, in order?', explain:'The column is Text-typed (because of ₹ and commas), so Power BI can\'t sum it. Fix: Replace Values to strip ₹ and commas, then Change Data Type to Decimal Number. Data type must be numeric before any aggregation works.'},
{t:'scenario', mod:'Connecting & Power Query', q:'Two rows in your HR dataset both say Employee ID "EMP101" but belong to two clearly different people. What issue is this, and why is it dangerous for a headcount dashboard?', explain:'A duplicate ID / broken primary key. Any "by Employee ID" chart merges two different people into one, undercounting headcount and mixing their salary/performance data. Fix by assigning truly unique IDs or correcting the source.'},
{t:'mcq', mod:'Visualizations', q:'Which chart type should you AVOID when you have 9 categories to compare?', opts:['Bar Chart','Pie Chart','Line Chart','Table'], correct:1, explain:'The Rule of 5: pie charts fail past ~5 categories — angles become impossible to compare accurately.'},
{t:'mcq', mod:'Visualizations', q:'What does dragging a field into the "Size" well of a Scatter Chart create?', opts:['A Tree Map','A Bubble Chart','A Gauge','A Filled Map'], correct:1, explain:'The Size well adds a third dimension, turning flat dots into sized bubbles.'},
{t:'mcq', mod:'Visualizations', q:'On a Gauge Chart, what does the small marker line represent?', opts:['The Minimum','The current Actual value','The Target','The Maximum'], correct:2, explain:'The Target marker is the goal line the Actual fill is measured against.'},
{t:'mcq', mod:'Visualizations', q:'Why should you almost always turn OFF data labels on a dense Line Chart with 365 daily points?', opts:['Data labels are never useful','They would overlap into unreadable clutter','Line charts can\'t display labels','It slows down the report'], correct:1, explain:'With hundreds of points, labels overlap into noise — let the line\'s shape speak instead.'},
{t:'mcq', mod:'Visualizations', q:'What does "Edit Interactions" control?', opts:['Which colors a chart uses','How clicking one visual filters or highlights other visuals on the page','How to rename a chart\'s title','Where a visual is positioned on the page'], correct:1, explain:'Edit Interactions controls the filter/highlight/none behavior between visuals sharing a page.'},
{t:'scenario', mod:'Visualizations', q:'Your manager wants "top 3 products by revenue" shown in a board meeting where people glance at the slide for 5 seconds. Bar chart, pie chart, or scatter plot — and why?', explain:'Bar chart — it enables instant, accurate comparison of magnitude. A pie chart needs slower angle comparison, and a scatter needs two numeric variables, not a ranking.'},
{t:'scenario', mod:'Visualizations', q:'You built a Sales-vs-Profit scatter plot and one dot sits far from every other dot (high Sales, very low/negative Profit). What should you do next?', explain:'Investigate before presenting — could be a real event (a heavily discounted bulk order) or a data error. Never silently delete or ignore an outlier; it\'s often the most important point on the chart, not the most disposable.'},

{t:'mcq', mod:'Advanced Visualizations', q:'What\'s the key difference between a Table and a Matrix visual?', opts:['They are functionally identical','A Table shows one row per record; a Matrix groups rows into a hierarchy with subtotals','A Matrix can only show text, not numbers','A Table always has fewer columns'], correct:1, explain:'A Table lists records flat, one row each. A Matrix groups rows into a hierarchy and subtotals automatically, like an Excel PivotTable.'},
{t:'mcq', mod:'Advanced Visualizations', q:'You want Credit Score below 600 shown as a hard red cell, not a smooth gradient. Which conditional formatting Format style do you pick?', opts:['Gradient','Rules','Icons only','Data bars only'], correct:1, explain:'Rules-based formatting draws explicit if/then bands (a hard cutoff); Gradient shades continuously across the range instead.'},
{t:'mcq', mod:'Advanced Visualizations', q:'A KPI card shows raw Total Sales but should turn red or green based on performance vs. a target. What do you point "Based on field" at?', opts:['The same Sales field being displayed','A separate Sales vs Target % measure','Nothing — this requires a custom visual','The Values well cannot use a different field'], correct:1, explain:'Conditional formatting can be driven by a different, hidden measure than the one displayed — the visible number never changes, only what decides its color does.'},
{t:'mcq', mod:'Advanced Visualizations', q:'Which filter scope affects every visual on every page of the report, including pages added later?', opts:['Visual-level','Page-level','Report-level','Filters never apply to future pages'], correct:2, explain:'Report-level is the broadest scope — every visual on every page, present and future, inherits it automatically.'},
{t:'mcq', mod:'Advanced Visualizations', q:'You drop Region into a Matrix\'s Rows well, then drop Category into Rows underneath it. What did you just build?', opts:['Two separate matrices','A hierarchy — Category nested inside Region','An error — Rows can only hold one field','A Columns cross-tab'], correct:1, explain:'Stacking fields in Rows builds a hierarchy, nested in the order they were dropped in, complete with expand/collapse and subtotals per level.'},
{t:'mcq', mod:'Advanced Visualizations', q:'When should you reach for a custom visual from AppSource instead of a built-in chart?', opts:['Whenever it looks more advanced','Only when a built-in chart structurally cannot answer the business question','Every time a report is for senior management','Custom visuals should never be used'], correct:1, explain:'Default bias is built-in visuals — reach into AppSource only when you can name the specific thing a built-in chart genuinely can\'t show, like a real date-range Gantt bar.'},
{t:'mcq', mod:'Advanced Visualizations', q:'A Table visual has its built-in header Search icon turned on. How is this different from a report-level slicer?', opts:['They are exactly the same feature','Table search only filters that one Table visual and isn\'t saved as report state; a slicer can affect other visuals and its selection persists','Search is only available on a Matrix, not a Table','Slicers cannot filter text fields'], correct:1, explain:'Table search is scoped to that single visual and resets — a slicer\'s selection is part of the report\'s state and can drive cross-filtering elsewhere.'},
{t:'scenario', mod:'Advanced Visualizations', q:'Your Matrix\'s Region subtotals look right, but after a colleague turns off "Row subtotals" for the Category level, they claim the Grand Total changed too. What\'s the correct expectation, and what would you actually check?', explain:'Turning off subtotals at one row level should NOT touch the Grand Total — it\'s controlled separately in the same Subtotals panel. If it really changed, check whether the Grand Total toggle or a filter was also changed at the same time, not the row-level subtotal itself.'},
{t:'scenario', mod:'Advanced Visualizations', q:'A slicer works fine when clicked, but a report viewer complains none of the OTHER visuals on the page react to it. What\'s the first thing to check?', explain:'Edit Interactions (Format ribbon) — one or more visuals may have been explicitly set to "None" for that slicer, deliberately or by accident, disabling the cross-filter response.'},

{t:'mcq', mod:'DAX — Basics & Measures', q:'Which should Total Sales = SUM(FactInternetSales[SalesAmount]) be — a calculated column or a measure?', opts:['Calculated column, because it involves a table field','Measure, because the number should recalculate based on whatever is filtered','Either works identically','Neither — this needs a Power Query step'], correct:1, explain:'If a number should change when someone clicks a slicer, it\'s a measure — calculated columns compute once and are stored, unresponsive to filter context.'},
{t:'mcq', mod:'DAX — Basics & Measures', q:'What does DIVIDE do that a plain "/" division operator doesn\'t handle safely?', opts:['Nothing, they are identical','Returns blank (or a specified alternate) instead of an error when the denominator is 0','Only works on whole numbers','It\'s faster but functionally identical'], correct:1, explain:'DIVIDE has built-in divide-by-zero protection — a plain "/" throws an error the moment any row has a zero denominator.'},
{t:'mcq', mod:'DAX — Basics & Measures', q:'You drag FactInternetSales[SalesAmount] straight into a Card\'s Values well with no DAX written. What did Power BI just create?', opts:['Nothing happens until you write a formula','An implicit measure — a default aggregation created automatically','A calculated column','An error, since a raw field can\'t go into Values'], correct:1, explain:'Power BI creates an implicit measure on the spot. It works, but can\'t be renamed/reused/reformatted as cleanly as an explicit measure written with New Measure — which is why this course always writes explicit ones.'},
{t:'mcq', mod:'DAX — Basics & Measures', q:'FactInternetSales has one row per what — per order, or per order LINE?', opts:['Per order — one row always equals one whole order','Per order line — a single order with 3 products is 3 rows','It varies randomly by product','Per customer, not per order'], correct:1, explain:'This is why DISTINCTCOUNT(SalesOrderNumber) and COUNTROWS(FactInternetSales) give different numbers, and why AVERAGE(SalesAmount) quietly answers "average per line" instead of "average per order."'},
{t:'mcq', mod:'DAX — Basics & Measures', q:'Why does an iterator like SUMX exist, when SUM already aggregates a column?', opts:['SUMX is just a faster version of SUM','SUMX computes an expression fresh on each row, THEN aggregates — needed when the calculation itself varies row by row, not just the final total','SUMX only works on text columns','There\'s no real difference, they\'re interchangeable'], correct:1, explain:'SUM aggregates a column that already exists. SUMX is required when the number to aggregate has to be COMPUTED first, per row — like SalesAmount minus TotalProductCost, calculated on each row before those results get summed.'},
{t:'scenario', mod:'DAX — Basics & Measures', q:'A teammate builds Total Sales as a calculated column instead of a measure. What will a report viewer notice once they click a Region slicer?', explain:'Nothing changes — a calculated column stores one fixed value per row/table that doesn\'t respond to filter context. It needs to be a measure using SUM(), which recalculates live for whatever\'s currently filtered.'},
{t:'scenario', mod:'DAX — Basics & Measures', q:'A colleague built Average Order Value as AVERAGE(FactInternetSales[SalesAmount]) instead of DIVIDE(SUM(SalesAmount), DISTINCTCOUNT(SalesOrderNumber)). The number looks plausible on the report. What\'s actually wrong with it?', explain:'AVERAGE(SalesAmount) averages per ORDER LINE, not per order — since a single order can span multiple line-item rows, this systematically differs from a true per-order average, usually understating it, and looking "plausible" is exactly why it can go unnoticed.'},

{t:'mcq', mod:'DAX — Time Intelligence', q:'TOTALYTD and SAMEPERIODLASTYEAR both silently assume what exists in the model?', opts:['A calculated column on every table','A properly marked Date table with a continuous date column','A relationship to a geography table','Nothing — they work on any date-like text column'], correct:1, explain:'Time intelligence functions need a real, continuous Date column marked as the model\'s official Date table — a text column that merely looks like a date will not work.'},
{t:'mcq', mod:'DAX — Time Intelligence', q:'A Sales YTD card shows a small number on January 5th and a much larger number on December 30th of the same year. Is this a bug?', opts:['Yes, YTD should always show the full-year total','No — YTD is a running total from January 1st to whatever date is in context, so it grows through the year by design','Yes, but only if the model uses AdventureWorksDW','No, but only because of a rounding setting'], correct:1, explain:'That growth through the year is exactly what "year to date" means — not a bug, the correct behavior of a running total.'},
{t:'scenario', mod:'DAX — Time Intelligence', q:'DimDate is marked as the Date Table, but pointed at DimDate[DateKey] (an integer like 20250115) instead of DimDate[FullDateAlternateKey]. What breaks, and why?', explain:'Time intelligence functions need a genuine datetime column to do calendar math with — an integer that merely LOOKS date-shaped to a human has no calendar meaning to DAX, so TOTALYTD/SAMEPERIODLASTYEAR either error or silently return wrong numbers against it.'},

{t:'mcq', mod:'DAX — Context', q:'What\'s the difference between row context and filter context?', opts:['They are two names for the same thing','Row context is "which row am I on" (inside iterators/calculated columns); filter context is "what\'s currently sliced/filtered" (from slicers, visuals, CALCULATE)','Row context only exists in Power Query, not DAX','Filter context only applies to calculated columns'], correct:1, explain:'Different mechanisms entirely — row context drives per-row calculation inside iterators; filter context is what makes the same measure show different numbers in different cells of a visual.'},
{t:'mcq', mod:'DAX — Context', q:'SELECTEDVALUE(DimProduct[ProductLine], "All Product Lines") — what does the second argument do?', opts:['Nothing, it\'s optional decoration','Provides the fallback text shown when more than one ProductLine is in context, instead of returning a silent blank','Sets the default filter for the whole report','Forces the measure to always show that text'], correct:1, explain:'SELECTEDVALUE returns the one value in context if exactly one remains — otherwise it falls back to the second argument. Without it, a multi-selection returns blank, which reads as a broken title rather than a working one.'},
{t:'mcq', mod:'DAX — Context', q:'What does HASONEVALUE(DimProduct[ProductLine]) return when a viewer has selected exactly one ProductLine in a slicer?', opts:['TRUE','FALSE','Blank','An error'], correct:0, explain:'HASONEVALUE returns TRUE only when filter context has narrowed that column to exactly one value — useful inside an IF to make a measure behave differently at a summary level than drilled down to one row.'},
{t:'scenario', mod:'DAX — Context', q:'A Matrix has Rows = DimProduct[ProductLine], Columns = DimProduct[Class], Values = [Total Sales], and the page also has a Region slicer set to "West." List every filter acting on the single cell where ProductLine="M" crosses Class="H."', explain:'Three filters stack on that one cell: ProductLine = "M" (from the row), Class = "H" (from the column), and Region = "West" (from the slicer, invisible on the Matrix itself but still filtering it). Change any one and the same formula recomputes fresh under the new stack.'},

{t:'mcq', mod:'DAX — CALCULATE Mastery', q:'What is the core job of CALCULATE?', opts:['It only sums numbers, nothing else','It lets a measure override its own filter context on purpose','It removes all filters permanently from the report','It converts a measure into a calculated column'], correct:1, explain:'CALCULATE computes an expression under a deliberately different filter condition than whatever a slicer or visual currently has selected.'},
{t:'mcq', mod:'DAX — CALCULATE Mastery', q:'In CALCULATE(SUM(FactInternetSales[SalesAmount]), DimProduct[ProductLine] = "R"), what happens if a report viewer has separately selected ProductLine = "M" in a slicer?', opts:['The measure returns blank because the filters conflict','CALCULATE\'s explicit filter argument overrides the slicer, so it still shows ProductLine R sales','The slicer wins and shows ProductLine M sales instead','Power BI throws an error'], correct:1, explain:'That\'s the entire trick of CALCULATE — the explicit filter argument overrides whatever filter context the report would otherwise apply.'},
{t:'mcq', mod:'DAX — CALCULATE Mastery', q:'When is FILTER required inside CALCULATE, instead of a bare boolean condition like Column = "Value"?', opts:['FILTER is never actually required, it\'s just a style preference','When the condition needs an expression a single column=value pair can\'t express — comparing two columns, combining conditions with OR across columns, or referencing a measure','FILTER only works with text columns, never numbers','CALCULATE cannot accept a bare boolean condition at all'], correct:1, explain:'A simple single-column comparison can be written as a bare boolean directly in modern DAX. FILTER becomes necessary once the logic goes beyond that — e.g. comparing ListPrice to StandardCost on the same row.'},
{t:'mcq', mod:'DAX — CALCULATE Mastery', q:'CALCULATE([Total Sales], ALL(DimProduct)) on a Matrix broken out by ProductLine — what happens to the number?', opts:['It shows each ProductLine\'s own total, same as without ALL','It shows the SAME grand total on every single row, because ALL strips the ProductLine filter that made rows differ','It returns an error','It only affects the Matrix\'s Grand Total row, not the individual rows'], correct:1, explain:'ALL(DimProduct) removes filters from every column on DimProduct, including ProductLine — so every row computes the same unfiltered grand total. Dividing the row\'s own (non-ALL) total by this constant produces the %-of-total pattern.'},
{t:'mcq', mod:'DAX — CALCULATE Mastery', q:'What\'s the difference between ALLEXCEPT and ALLSELECTED?', opts:['They are identical functions with different names','ALLEXCEPT removes every filter on a table except the columns you name; ALLSELECTED keeps whatever the viewer explicitly chose in a slicer while removing the visual\'s own row/column filters','ALLSELECTED only works in DirectQuery mode','ALLEXCEPT can only be used with numeric columns'], correct:1, explain:'ALLEXCEPT is about which COLUMNS keep their filters. ALLSELECTED is about respecting the VIEWER\'s slicer choice specifically, regardless of which columns are involved — a "% of what\'s currently shown" pattern rather than "% of everything."'},
{t:'scenario', mod:'DAX — CALCULATE Mastery', q:'A colleague\'s measure uses CALCULATE with ALL(DimProduct) and now returns the exact same number on every row of a Region-by-ProductLine Matrix, when it should vary by ProductLine. What most likely went wrong?', explain:'ALL(DimProduct) strips filters from EVERY column on DimProduct, not just the one column the colleague meant to widen. The fix is scoping it — ALL(DimProduct[SomeOtherColumn]) alone, or ALLEXCEPT(DimProduct, DimProduct[ProductLine]) to keep exactly the ProductLine filter alive.'},
{t:'scenario', mod:'DAX — CALCULATE Mastery', q:'DimProduct and FactInternetSales aren\'t related in the model yet. A Matrix mixing fields from both shows blank or wrong totals. What\'s the fix, and where do you apply it?', explain:'Open Model view and create a relationship between the matching key columns (ProductKey on both tables) — Power BI can\'t correctly combine fields from two unrelated tables until that relationship exists.'},

{t:'mcq', mod:'Power Query Deep Dive', q:'Every step in the Applied Steps pane corresponds to what, under the hood?', opts:['A saved screenshot','One line of M code, viewable in the Advanced Editor','A DAX measure','A SQL query'], correct:1, explain:'Applied Steps is just a friendly view onto the query\'s M code — View → Advanced Editor shows the exact same logic as readable M.'},
{t:'mcq', mod:'Power Query Deep Dive', q:'A Loan Amount column shows "₹10,00,000" and won\'t convert to a number. What\'s the correct order of fixes?', opts:['Change Data Type first, then Replace Values','Replace Values to strip the ₹ symbol and commas first, then Change Data Type','Delete the row — it can\'t be fixed','Rename the column'], correct:1, explain:'Currency-formatted text has to be de-formatted before it can be type-converted — trying to type-convert first just errors.'},
{t:'mcq', mod:'Power Query Deep Dive', q:'A numeric column has one row containing the text "Nine Thousand." What happens when you convert that column\'s type to Decimal Number?', opts:['Power BI silently converts it to 9000','That row shows an Error, which you then have to decide how to handle','The whole query fails to load with no explanation','Text values are automatically skipped'], correct:1, explain:'Power Query flags the un-parseable row as an Error rather than guessing — deciding what to do with it (Remove Errors, or manually fix it) is a judgment call, not automatic.'},
{t:'mcq', mod:'Power Query Deep Dive', q:'Why does Remove Duplicates usually belong near the END of a cleaning sequence, not the start?', opts:['Order is irrelevant','Cleaning values first (trimming spaces, fixing currency text) means near-duplicates that only differ by formatting get correctly recognized as true duplicates','Remove Duplicates only works on already-typed columns','It\'s a performance optimization only, not a correctness issue'], correct:1, explain:'Doing it early risks missing duplicates that are only "different" because of an uncleaned trailing space or an unformatted currency symbol.'},
{t:'mcq', mod:'Power Query Deep Dive', q:'What\'s the honest, correct move when a column contains implausible-but-technically-valid values, like a Credit Score of 9999?', opts:['Always delete the row immediately','Flag it and consider asking the data owner — implausible isn\'t the same as definitely wrong','Silently cap it at 900','Ignore it, aggregations will average it out anyway'], correct:1, explain:'Power Query can\'t judge business plausibility for you — flagging and asking is the defensible move, not silently deleting or guessing a correction.'},
{t:'scenario', mod:'Power Query Deep Dive', q:'You load a CSV and Applied Steps shows "Promoted Headers" at the top. What did that step actually do, and why does Power Query usually do it automatically?', explain:'It took the first row of raw data and used its values as column names instead of treating them as a data row. CSV/Excel exports almost always have real headers in row 1, so the default import assumes and applies this — worth a quick confirm, not a blind assumption, on messier files.'},
{t:'scenario', mod:'Power Query Deep Dive', q:'A colleague hand-fixed a few bad cells directly in Excel before loading the file, instead of using query steps. Why does this cost marks even if the final numbers look correct?', explain:'It\'s not reproducible — next month\'s fresh export has the same problems all over again, and the fix has to be redone by hand every time. A proper query step re-cleans automatically on every refresh; a hand-edited file doesn\'t.'},

{t:'mcq', mod:'Power BI Service', q:'What\'s the actual difference between a Report and a Dashboard in the Power BI Service?', opts:['They\'re the same thing with different names','A Report is the multi-page file from Desktop; a Dashboard is a single-page pinboard built by pinning visuals, existing only in the Service','A Dashboard can only be built in Desktop','A Report can only ever have one page'], correct:1, explain:'Report = multi-page file, built in Desktop. Dashboard = single-page cloud pinboard, built by pinning visuals once a report is published.'},
{t:'mcq', mod:'Power BI Service', q:'Which workspace role should a stakeholder get if they should only ever view a report, never edit it?', opts:['Admin','Member','Contributor','Viewer'], correct:3, explain:'Viewer is read-only by design — Admin/Member/Contributor all carry some level of edit or management access.'},
{t:'mcq', mod:'Power BI Service', q:'A report was built in Import mode. What does it need to stay current with the source data?', opts:['Nothing, it updates live automatically','A Scheduled Refresh, since Import mode copies data into Power BI\'s own memory at load time','DirectQuery must be enabled separately','It can never be updated once published'], correct:1, explain:'Import copies a snapshot into memory — it only reflects new source data after a refresh actually runs, scheduled or manual.'},
{t:'mcq', mod:'Power BI Service', q:'What does a Gateway actually do?', opts:['Deletes stale reports automatically','Securely bridges the cloud Power BI Service to a data source inside a private company network','It\'s another name for a workspace','It converts DAX to M code'], correct:1, explain:'A Gateway is the secure connector letting the cloud Service reach an on-premises or private-network data source it otherwise couldn\'t see.'},
{t:'mcq', mod:'Power BI Service', q:'Why does the Q&A visual answer "total sales by region" better when a column is named Sales than when it\'s still called Col_7?', opts:['Q&A doesn\'t use column names at all','Q&A matches plain-English questions against the model\'s actual field names','Column names never affect Q&A, only data types do','Col_7 would cause a hard error'], correct:1, explain:'Q&A parses natural language against real field names — a meaningful name like Sales is something it can match; a placeholder like Col_7 gives it nothing to work with.'},
{t:'scenario', mod:'Power BI Service', q:'Your manager asks you to "just send them the dashboard" but hands you a .pbix file. What\'s actually being conflated here, and what would satisfy the literal request?', explain:'A .pbix file is a Report, built in Desktop — not a Dashboard, which only exists after publishing to the Service and pinning visuals to a single-page board there. Satisfying the literal request means publishing first, then building an actual Dashboard, not just emailing the file.'},
{t:'scenario', mod:'Power BI Service', q:'A published report\'s data hasn\'t updated in two weeks, even though the source Excel file changes daily. Sharing permissions are fine and nobody touched the report itself. What\'s the most likely cause?', explain:'No Scheduled Refresh is configured, or it\'s failing silently (e.g. a missing Gateway connection for an on-premises file) — Import-mode data only updates when a refresh actually runs, not automatically just because the source changed.'},
];

function renderQuiz(){
  const list = document.getElementById('quizList');
  const mcqTotal = QUIZ.filter(x=>x.t==='mcq').length;
  document.getElementById('scoreDisplay').textContent = `0 / ${mcqTotal}`;
  let html = '';
  let mod = '';
  QUIZ.forEach((item, i)=>{
    if(item.mod !== mod){ mod = item.mod; html += `<h3 style="margin-top:26px">${mod}</h3>`; }
    if(item.t === 'mcq'){
      html += `<div class="card" style="margin-bottom:14px" data-qi="${i}">
        <div style="font-size:.68rem" class="eyebrow">Question ${i+1} · Multiple choice</div>
        <p style="font-weight:600;margin-top:6px">${item.q}</p>
        <div class="qopts" style="display:grid;gap:8px;margin-top:10px">
          ${item.opts.map((o,oi)=>`<button class="btn ghost sm qopt" style="text-align:left;justify-content:flex-start" data-oi="${oi}" onclick="answerQuiz(${i},${oi})">${o}</button>`).join('')}
        </div>
        <p class="qexplain" style="display:none;font-size:.85rem;color:var(--text-muted);margin-top:10px;border-top:1px solid var(--border);padding-top:10px"></p>
      </div>`;
    } else {
      html += `<div class="card" style="margin-bottom:14px" data-qi="${i}">
        <div style="font-size:.68rem" class="eyebrow">Question ${i+1} · Scenario</div>
        <p style="font-weight:600;margin-top:6px">${item.q}</p>
        <button class="btn ghost sm" onclick="revealScenario(${i})">Reveal model answer</button>
        <p class="qexplain" style="display:none;font-size:.85rem;color:var(--text-muted);margin-top:10px;border-top:1px solid var(--border);padding-top:10px">${item.explain}</p>
      </div>`;
    }
  });
  list.innerHTML = html;
}
let quizScore = 0;
const answered = new Set();
function answerQuiz(i, oi){
  if(answered.has(i)) return;
  answered.add(i);
  const item = QUIZ[i];
  const card = document.querySelector(`[data-qi="${i}"]`);
  const btns = card.querySelectorAll('.qopt');
  btns.forEach((b,bi)=>{
    b.style.pointerEvents = 'none';
    if(bi === item.correct){ b.style.background = 'var(--good-soft)'; b.style.color = 'var(--good)'; b.style.borderColor='transparent'; b.style.fontWeight='700'; }
    else if(bi === oi){ b.style.background = 'var(--bad-soft)'; b.style.color = 'var(--bad)'; b.style.borderColor='transparent'; }
  });
  const ex = card.querySelector('.qexplain');
  ex.textContent = (oi===item.correct? '✓ Correct. ' : '✗ Not quite. ') + item.explain;
  ex.style.display = 'block';
  if(oi === item.correct) quizScore++;
  document.getElementById('scoreDisplay').textContent = `${quizScore} / ${QUIZ.filter(x=>x.t==='mcq').length}`;
}
function revealScenario(i){
  const card = document.querySelector(`[data-qi="${i}"]`);
  card.querySelector('.qexplain').style.display = 'block';
}
document.getElementById('resetQuiz').addEventListener('click', ()=>{
  quizScore = 0; answered.clear(); renderQuiz();
});

renderQuiz();
</script>
