<script>

const EXERCISES = [
{n:1, title:'Sales Dashboard', level:'Beginner', mins:10, dataset:'sales_clean', skills:'Connect to Excel, basic Bar + Pie + Card, sorting, data labels.',
  scenario:'You\'re a junior analyst at an online retailer. Your manager wants a one-page snapshot before a 9 AM meeting.',
  tasks:['Import the Sales dataset','2 KPI Cards: Total Sales, Total Profit','Bar Chart: Sales by Category, sorted descending, labels on','Pie Chart: Market Share by Category','Title text box: "Sales Snapshot"']},
{n:2, title:'Retail Dashboard', level:'Easy–Medium', mins:12, dataset:'retail_clean', skills:'Line chart trend, Map, Filters pane.',

  tasks:['Import the Retail dataset','Line Chart: Sales by Month','Filled Map: Sales by State','Table: Store, City, Sales, Inventory','Page filter: 3 states of your choice','Bonus: Treemap of Sales by Product']},
{n:3, title:'Hospital Dashboard', level:'Medium', mins:15, dataset:'hospital_clean', skills:'Scatter plot, Gauge, first non-trivial DAX measure.',

{n:4, title:'HR Dashboard', level:'Medium–Hard', mins:15, dataset:'hr_clean', skills:'AVERAGE/AVERAGEX, conditional formatting, slicers.',
